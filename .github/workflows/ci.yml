name: Validation Python

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer le projet et les outils de développement
        run: python -m pip install -e ".[dev]"

      - name: Vérifier l'import du package
        run: python -c "from autocall_replication import AutocallProduct, price_autocall_bs_mc; print(AutocallProduct())"

      - name: Exécuter la validation complète
        run: python scripts/validate.py

